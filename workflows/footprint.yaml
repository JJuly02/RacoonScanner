name: "Footprinting (pełny recon)"
description: >
  Rozpoznanie od domeny/IP: WHOIS + Certificate Transparency + DNS + Shodan →
  discovery → skan portów i usług → enumeracja per-usługa (SMB null session) →
  fingerprint web. Każdy krok karmi kolejny (nmap taguje usługi do footprintu).
stages:
  - name: "WHOIS (rejestr domeny)"
    adapter: whois
  - name: "Certificate Transparency (crt.sh)"
    adapter: crtsh
  - name: "DNS enumeration"
    adapter: dnsrecon
  - name: "Passive recon (Shodan)"
    adapter: shodan
    options:
      api: auto
  - name: "Host discovery (ICMP)"
    adapter: ping
  - name: "Skan portów i usług"
    adapter: nmap
    options:
      fast: true
  - name: "SMB null session"
    adapter: smb
    requires: smb_targets
  - name: "Fingerprint web"
    adapter: whatweb
    requires: web_targets
